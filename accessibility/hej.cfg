\Preamble{xhtml}
\ExplSyntaxOn
% Get the value of rowhead key and save it in the \lTblrRowHeadInt for later use
\def\:setrowhead{
    \int_set:Nn \lTblrRowHeadInt
      { \__tblr_prop_item:ne { inner } { rowhead } + 0 }
}
% print either th or td, depending on the value of \lTblrRowHeadInt
\def\:celltype{\int_compare:nTF{\int_value:w\lTblrRowHeadInt>=\HRow}{th}{td}}
\ExplSyntaxOff

% this is the configuration for the tabularray package with the support for <th>
\catcode`\:=11
\makeatletter
\Configure{tabularray}{%
  \ifvmode\IgnorePar\fi\EndP%
  \gHAdvance\Next:TableNo by 1 \global\let\TableNo=\Next:TableNo%
  \HCode{<table class="tabularray \@currenvir" id="tbl-\TableNo">}
}{\ifvmode\IgnorePar\fi\EndP\HCode{</table>}}
{\:setrowhead\HCode{<tr id="row-\TableNo-\HRow-">}}{\HCode{</tr>}}
{\HCode{<\:celltype\space id="cell\TableNo-\HRow-\HCol" style="\CellStyle" \CellAttributes>}}{\HCode{</\:celltype>}}
{\Configure{tabularrayattributes}{rowspan="\HRowspan"}}
{\Configure{tabularrayattributes}{colspan="\HMultispan"}}{}
\catcode`\:=12
\makeatother

\begin{document}
\EndPreamble
